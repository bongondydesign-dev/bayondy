<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg-obsidian" x1="16" y1="4" x2="104" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121F38" />
      <stop offset="52%" stop-color="#0B1222" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>

    <radialGradient id="ambient-aurora" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(46 36) rotate(48) scale(84)">
      <stop offset="0%" stop-color="#37D6D0" stop-opacity="0.26" />
      <stop offset="46%" stop-color="#2864FF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#080B14" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rim-specular" x1="12" y1="0" x2="108" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8EDF5" stop-opacity="0.28" />
      <stop offset="42%" stop-color="#37D6D0" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2864FF" stop-opacity="0.06" />
    </linearGradient>

    <linearGradient id="portal-b-grad" x1="28" y1="20" x2="92" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6BF4EE" />
      <stop offset="34%" stop-color="#37D6D0" />
      <stop offset="70%" stop-color="#2864FF" />
      <stop offset="100%" stop-color="#1947C6" />
