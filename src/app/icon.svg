    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M38 22H65C76.6 22 85 29.8 85 40.5C85 48.2 80.5 54 73.5 56.6C83.2 59.4 90 67.2 90 77.5C90 89.8 80.2 98 67 98H38C33.6 98 30 94.4 30 90V30C30 25.6 33.6 22 38 22ZM46 34.5V50.5H62C67.8 50.5 71.5 47.2 71.5 42.5C71.5 37.8 67.8 34.5 62 34.5H46ZM46 64V85.5H64.5C71.8 85.5 76.5 81.4 76.5 74.75C76.5 68.1 71.8 64 64.5 64H46Z"
