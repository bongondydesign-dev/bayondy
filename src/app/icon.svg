  <!-- Obsidian squircle container -->
  <rect width="120" height="120" rx="28" fill="url(#bg-obsidian)" />
  <rect width="120" height="120" rx="28" fill="url(#ambient-aurora)" />
  <rect x="1.5" y="1.5" width="117" height="117" rx="26.5" stroke="url(#rim-specular)" stroke-width="1.5" />

